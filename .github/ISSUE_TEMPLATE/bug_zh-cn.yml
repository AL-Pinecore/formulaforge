name: "🐛 Bug 反馈"
description: "报告 Bug 或异常行为"
title: "[Bug] "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        感谢你抽出时间反馈 Bug！
        请尽可能提供详细的信息，以便我们能够复现并修复该问题。

  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 请清楚地描述你遇到的问题。
      placeholder: 发生了什么问题？
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: FormulaForge 版本
      description: 你正在使用哪个版本的 FormulaForge？
      placeholder: "例如：v1.2.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 运行平台
      options:
        - macOS
        - Windows
        - Linux
        - 浏览器
        - 其他
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: 运行平台版本
      description: |
        请填写你正在使用的运行平台版本。
        如果你在上方选择了“其他”，请同时填写运行平台名称。
      placeholder: 例如：macOS 26 / Windows 11 / Ubuntu 26.04 / FreeBSD 14.1
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请提供能够复现该问题的具体步骤。
      placeholder: |
        1. 打开 FormulaForge
        2. ...
        3. ...
        4. 出现问题
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你原本期望发生什么？
      placeholder: 请描述你预期的行为。
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？
      placeholder: 请描述实际发生的情况。
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 可以在此添加截图、视频或其他有助于定位问题的信息。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，并确认该问题没有被重复报告。
          required: true

        - label: 我正在使用最新版本的 FormulaForge。
          required: true