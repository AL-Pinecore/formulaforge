name: "✨ 功能建议"
description: "建议新功能或对现有功能进行改进"
title: "[Enhancement] "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进 FormulaForge！
        请描述你的想法，以及它希望解决的问题。

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 你希望解决什么问题或现有功能的哪些限制？
      placeholder: |
        我目前遇到的问题是……
        如果能够……会很有帮助。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议的解决方案
      description: 请描述你认为这个功能应该如何实现或运作。
      placeholder: 请描述你建议的解决方案。
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      description: 这个功能建议与 FormulaForge 的哪个部分相关？
      options:
        - 编辑器
        - 渲染
        - 导入
        - 导出
        - 用户界面
        - 键盘 / 输入
        - 设置
        - 性能
        - 其他
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: |
        可以在此添加设计稿、截图、示例或其他相关信息。
        如果你在上方选择了“其他”，也可以在这里说明该功能建议涉及的具体部分。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，并确认该功能尚未被提出。
          required: true