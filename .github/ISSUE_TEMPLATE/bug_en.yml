name: "🐛 Bug Report"
description: "Report a bug or unexpected behavior"
title: "[Bug] "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        Please provide as much information as possible so we can reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clearly describe the problem you encountered.
      placeholder: What went wrong?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: FormulaForge Version
      description: Which version of FormulaForge are you using?
      placeholder: "e.g. v1.2.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Windows
        - Linux
        - Web Browser
        - Other
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Operating System Version
      description: |
        Please provide the OS version. If you selected "Other",
        include the operating system name as well.
      placeholder: e.g. macOS 26 / Windows 11 / Ubuntu 26.04 / FreeBSD 14.1
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Please provide the steps needed to reproduce the issue.
      placeholder: |
        1. Open FormulaForge
        2. ...
        3. ...
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe the expected behavior.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Describe the actual behavior.
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add screenshots, videos, or any other useful information.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and confirmed this is not a duplicate.
          required: true

        - label: I am using the latest version of FormulaForge.
          required: true